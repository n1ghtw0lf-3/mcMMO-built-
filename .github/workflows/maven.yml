# This workflow automatically tests new commits and pull requests.

name: Compile and test

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/maven.yml'

  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'

jobs:
  compile:
    name: Maven compiler
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 25
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 3. Compile and run tests
      - name: Build and test with Maven
        run: mvn verify -B -Psql-tests -DdisableXmlReport=true
